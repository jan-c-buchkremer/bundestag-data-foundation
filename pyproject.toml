[project]
name = "bundestag-data-foundation"
version = "0.1.0"
description = "Ingestion, normalisation and query layer for German Bundestag data (speeches, roll-call votes, Drucksachen) with source pointers on every fact."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.scripts]
bdf = "bdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdf"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German text contains ambiguous unicode by nature

[tool.pytest.ini_options]
testpaths = ["tests"]
